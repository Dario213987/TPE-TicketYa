<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mail/fragments/layout :: head('Notificación')}"></head>
<body>
  <h2 th:text="${motivo}">MOTIVO</h2>
  <p>Hola <span th:text="${usuarioNombre}">Usuario</span>,</p>
  <p>Tu artista favorito <strong th:text="${participantesTexto}">Artistas</strong> publicó un evento en <strong th:text="${eventoCiudad}">Ciudad</strong>.</p>
  <p>Evento: <strong th:text="${eventoNombre}">Nombre</strong></p>
  <p>Fecha: <span th:text="${eventoFecha}">Fecha</span></p>
  <p>Lugar: <span th:text="${eventoLugar}">Lugar</span> (<span th:text="${eventoCiudad}">Ciudad</span>)</p>
</body>
</html>

server.port=${SERVER_PORT:0}
spring.application.name=ms-transacciones

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:5435/transacciones}
spring.datasource.username=${DB_USER:transacciones}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}
# Pasarela de pagos: timeout por intento y reintentos con backoff exponencial (TKY-85)
ticketya.pasarela.timeout-ms=${PASARELA_TIMEOUT_MS:3000}
ticketya.pasarela.max-intentos=${PASARELA_MAX_INTENTOS:3}
ticketya.pasarela.backoff-inicial-ms=${PASARELA_BACKOFF_INICIAL_MS:200}

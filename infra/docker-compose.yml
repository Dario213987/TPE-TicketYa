name: ticketya-infra

# Una instancia de base de datos por microservicio, cada una con su volumen y su puerto.
# Cada servicio elige PostgreSQL (por defecto) o MySQL. Para cambiar uno a MySQL ver
# la plantilla "MySQL" al final de los servicios.
# Para un servicio nuevo con base propia: copiar un bloque db-*, cambiar nombre,
# usuario, contraseña (${X_DB_PASSWORD}), puerto del host y volumen.
x-postgres: &postgres
  image: postgres:18
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 10

x-mysql: &mysql
  image: mysql:8.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
    interval: 5s
    timeout: 3s
    retries: 20

# Configuración común de los servicios de la aplicación.
# Los logs se escriben en el volumen compartido que lee Alloy.
x-app: &app
  restart: unless-stopped
  environment: &app-env
    EUREKA_URL: http://eureka-server:8761/eureka
    TICKETYA_LOGGING_DIR: /app/logs
  volumes:
    - app-logs:/app/logs

services:
  db-eventos:
    <<: *postgres
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: ${EVENTOS_DB_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [eventos-data:/var/lib/postgresql]

  db-tickets:
    <<: *postgres
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD}
    ports: ["127.0.0.1:5434:5432"]
    volumes: [tickets-data:/var/lib/postgresql]

  db-transacciones:
    <<: *mysql
    environment:
      MYSQL_DATABASE: transacciones
      MYSQL_USER: transacciones
      MYSQL_PASSWORD: ${TRANSACCIONES_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports: ["127.0.0.1:5435:3306"]
    volumes: [transacciones-data:/var/lib/mysql]

  db-devoluciones:
    <<: *postgres
    environment:
      POSTGRES_DB: devoluciones
      POSTGRES_USER: devoluciones
      POSTGRES_PASSWORD: ${DEVOLUCIONES_DB_PASSWORD}
    ports: ["127.0.0.1:5436:5432"]
    volumes: [devoluciones-data:/var/lib/postgresql]

  db-notificaciones:
    <<: *postgres
    environment:
      POSTGRES_DB: notificaciones
      POSTGRES_USER: notificaciones
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD}
    ports: ["127.0.0.1:5437:5432"]
    volumes: [notificaciones-data:/var/lib/postgresql]

  # ms-preferencias usa MongoDB (un documento por cliente).
  db-preferencias:
    image: mongo:7
    restart: unless-stopped
    ports: ["127.0.0.1:5438:27017"]
    volumes: [preferencias-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MySQL (plantilla). Para pasar un servicio a MySQL:
  #   1. Comentar su bloque db-* de PostgreSQL y descomentar este, cambiando
  #      nombre, base, usuario y contraseña. Mantener el MISMO puerto del host y
  #      el mismo volumen, así solo hay una base activa por servicio.
  #   2. En el pom del servicio, reemplazar org.postgresql:postgresql por
  #      com.mysql:mysql-connector-j (scope runtime).
  #   3. En su application.properties, cambiar el default de DB_URL a
  #      jdbc:mysql://localhost:<puerto>/<base>.
  # Ojo que el índice único parcial de D5 no existe
  # en MySQL, ese servicio debería quedarse en PostgreSQL.
  #
  # db-eventos:
  #   <<: *mysql
  #   environment:
  #     MYSQL_DATABASE: eventos
  #     MYSQL_USER: eventos
  #     MYSQL_PASSWORD: ${EVENTOS_DB_PASSWORD}
  #     MYSQL_RANDOM_ROOT_PASSWORD: "yes"
  #   ports: ["127.0.0.1:5433:3306"]
  #   volumes: [eventos-data:/var/lib/mysql]

  # Redis: una instancia por servicio que lo use, igual que las bases de datos.
  # ms-tickets lo usa para la fila virtual de eventos de alta demanda.
  redis-tickets:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Logs centralizados: Alloy lee los *.json.log que escribe cada servicio
  # (logs/<servicio>/ dentro de la carpeta desde donde se lanzó), los manda a
  # Loki y se consultan en Grafana (http://localhost:3000).
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: [loki-data:/loki]

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports: ["127.0.0.1:12345:12345"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ..:/ticketya:ro
      - app-logs:/ticketya/container-logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]

  # ms-preferencias usa Redis Streams para el historial de compras y asistencias.
  redis-preferencias:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ---------------------------------------------------------------------------
  # Servicios de la aplicación (TKY-112 / US-16.02)
  # ---------------------------------------------------------------------------
  eureka-server:
    <<: *app
    build:
      context: ..
      dockerfile: eureka-server/Dockerfile
    image: ticketya/eureka-server:local
    ports: ["127.0.0.1:8761:8761"]

  api-gateway:
    <<: *app
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    image: ticketya/api-gateway:local
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      eureka-server:
        condition: service_healthy

  ms-eventos:
    <<: *app
    build:
      context: ..
      dockerfile: ms-eventos/Dockerfile
    image: ticketya/ms-eventos:local
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://db-eventos:5432/eventos
      DB_USER: eventos
      DB_PASSWORD: ${EVENTOS_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-eventos:
        condition: service_healthy

  ms-tickets:
    <<: *app
    build:
      context: ..
      dockerfile: ms-tickets/Dockerfile
    image: ticketya/ms-tickets:local
    # Con réplicas, cada instancia escribe en su propio subdirectorio de logs.
    entrypoint: ["sh", "-c", "TICKETYA_LOGGING_DIR=/app/logs/ms-tickets-$${HOSTNAME:-replica} exec java -jar /app/app.jar"]
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://db-tickets:5432/tickets
      DB_USER: tickets
      DB_PASSWORD: ${TICKETS_DB_PASSWORD}
      REDIS_HOST: redis-tickets
      REDIS_PORT: "6379"
      TICKETS_PREFERENCIAS_REDIS_HOST: redis-preferencias
      TICKETS_PREFERENCIAS_REDIS_PORT: "6379"
      TICKETS_QR_SECRET: ${TICKETS_QR_SECRET:-dev-secret-cambiar}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-tickets:
        condition: service_healthy
      redis-tickets:
        condition: service_healthy
      redis-preferencias:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ms-transacciones:
    <<: *app
    build:
      context: ..
      dockerfile: ms-transacciones/Dockerfile
    image: ticketya/ms-transacciones:local
    environment:
      <<: *app-env
      DB_URL: jdbc:mysql://db-transacciones:3306/transacciones
      DB_USER: transacciones
      DB_PASSWORD: ${TRANSACCIONES_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-transacciones:
        condition: service_healthy

  ms-devoluciones:
    <<: *app
    build:
      context: ..
      dockerfile: ms-devoluciones/Dockerfile
    image: ticketya/ms-devoluciones:local
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://db-devoluciones:5432/devoluciones
      DB_USER: devoluciones
      DB_PASSWORD: ${DEVOLUCIONES_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      db-devoluciones:
        condition: service_healthy

  ms-notificaciones:
    <<: *app
    build:
      context: ..
      dockerfile: ms-notificaciones/Dockerfile
    image: ticketya/ms-notificaciones:local
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://db-notificaciones:5432/notificaciones
      DB_USER: notificaciones
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@ticketya.local
    depends_on:
      eureka-server:
        condition: service_healthy
      db-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  ms-preferencias:
    <<: *app
    build:
      context: ..
      dockerfile: ms-preferencias/Dockerfile
    image: ticketya/ms-preferencias:local
    environment:
      <<: *app-env
      MONGODB_URI: mongodb://db-preferencias:27017/ticketya_preferencias
      REDIS_HOST: redis-preferencias
      REDIS_PORT: "6379"
      EVENTOS_SERVICE_NAME: ms-eventos
    depends_on:
      eureka-server:
        condition: service_healthy
      db-preferencias:
        condition: service_healthy
      redis-preferencias:
        condition: service_healthy

volumes:
  eventos-data:
  tickets-data:
  transacciones-data:
  devoluciones-data:
  loki-data:
  alloy-data:
  grafana-data:
  notificaciones-data:
  preferencias-data:
  rabbitmq-data:
  app-logs:

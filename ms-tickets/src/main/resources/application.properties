server.port=${SERVER_PORT:0}
spring.application.name=ms-tickets
spring.config.import=optional:file:./infra/.env[.properties],optional:file:../infra/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/tickets}
spring.datasource.username=${DB_USER:tickets}
spring.datasource.password=${DB_PASSWORD:${TICKETS_DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:1000}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

tickets.disponibilidad.batch-size=${TICKETS_DISPONIBILIDAD_BATCH_SIZE:1000}

tickets.reserva.limite-por-cliente=${TICKETS_RESERVA_LIMITE_POR_CLIENTE:4}
tickets.reserva.expiracion=${TICKETS_RESERVA_EXPIRACION:PT10M}
tickets.reserva.liberacion-cron=${TICKETS_RESERVA_LIBERACION_CRON:*/30 * * * * *}
tickets.reserva.bloqueo-liberacion=${TICKETS_RESERVA_BLOQUEO_LIBERACION:PT5M}

# Reconciliación de pagos pendientes (TKY-87)
tickets.reconciliacion.cron=${TICKETS_RECONCILIACION_CRON:0 * * * * *}
tickets.reconciliacion.margen=${TICKETS_RECONCILIACION_MARGEN:PT1M}
tickets.reconciliacion.bloqueo=${TICKETS_RECONCILIACION_BLOQUEO:PT5M}
tickets.preferencias.enabled=${TICKETS_PREFERENCIAS_ENABLED:true}
tickets.preferencias.stream-ticket-utilizado=${TICKETS_PREFERENCIAS_STREAM_TICKET_UTILIZADO:ticket.utilizado}
tickets.preferencias.redis-host=${TICKETS_PREFERENCIAS_REDIS_HOST:localhost}
tickets.preferencias.redis-port=${TICKETS_PREFERENCIAS_REDIS_PORT:6381}

tickets.qr.secreto=${TICKETS_QR_SECRET:dev-secret-cambiar}

transacciones.name=${TRANSACCIONES_SERVICE_NAME:ms-transacciones}
transacciones.contextId=transacciones
spring.cloud.openfeign.client.config.transacciones.request-interceptors[0]=org.tudai.ticketya.tickets.client.TransaccionesHeadersInterceptor
# Timeout y reintentos hacia ms-transacciones (TKY-85). El read-timeout cubre los reintentos de
# ms-transacciones hacia la pasarela (~6,6 s); 2 intentos + backoff entran en los 15 s del gateway.
spring.cloud.openfeign.client.config.transacciones.connect-timeout=${TRANSACCIONES_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.transacciones.read-timeout=${TRANSACCIONES_READ_TIMEOUT_MS:7000}
tickets.transacciones.max-intentos=${TICKETS_TRANSACCIONES_MAX_INTENTOS:2}
tickets.transacciones.backoff-inicial-ms=${TICKETS_TRANSACCIONES_BACKOFF_INICIAL_MS:300}

eventos.name=${EVENTOS_SERVICE_NAME:ms-eventos}
eventos.contextId=eventos

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:ticketya}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT_MS:2s}
spring.rabbitmq.channel-rpc-timeout=${RABBITMQ_CHANNEL_RPC_TIMEOUT_MS:2s}
spring.rabbitmq.requested-heartbeat=${RABBITMQ_REQUESTED_HEARTBEAT_S:30s}
ticketya.rabbitmq.handshake-timeout-ms=${RABBITMQ_HANDSHAKE_TIMEOUT_MS:2000}
ticketya.rabbitmq.shutdown-timeout-ms=${RABBITMQ_SHUTDOWN_TIMEOUT_MS:2000}
ticketya.notificaciones.async.core-pool-size=${NOTIFICACIONES_ASYNC_CORE_POOL_SIZE:2}
ticketya.notificaciones.async.queue-capacity=${NOTIFICACIONES_ASYNC_QUEUE_CAPACITY:200}

tickets.habilitacion.enabled=${TICKETS_HABILITACION_ENABLED:true}
tickets.habilitacion.tamano-tanda=${TICKETS_HABILITACION_TAMANO_TANDA:50}
tickets.habilitacion.intervalo=${TICKETS_HABILITACION_INTERVALO:PT30S}
tickets.habilitacion.ttl-pase=${TICKETS_HABILITACION_TTL_PASE:PT5M}
tickets.habilitacion.tick-cron=${TICKETS_HABILITACION_TICK_CRON:*/5 * * * * *}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}

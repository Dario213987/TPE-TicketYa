server.port=${SERVER_PORT:0}
spring.application.name=ms-tickets

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/tickets}
spring.datasource.username=${DB_USER:tickets}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_JDBC_BATCH_SIZE:1000}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

tickets.disponibilidad.batch-size=${TICKETS_DISPONIBILIDAD_BATCH_SIZE:1000}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}
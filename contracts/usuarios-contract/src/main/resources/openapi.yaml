openapi: 3.0.3
info:
    title: ms-usuarios
    version: 1.0.0
    description: |
        Gestión de usuarios y roles, y autenticación.
        Los endpoints de /api/usuarios son solo para el rol ADMINISTRADOR.
        Los de /api/auth son públicos.
        Un usuario tiene un correo único, un nombre, una contraseña y uno o más roles.
tags:
    - name: usuarios
    - name: auth
paths:
    /api/usuarios:
        post:
            tags: [usuarios]
            operationId: crearUsuario
            summary: Crea un usuario con sus roles
            description: Un correo ya registrado (sin distinguir mayúsculas) responde 409.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CrearUsuarioRequest'
            responses:
                '201':
                    description: El usuario creado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsuarioResponse'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '409': { $ref: '#/components/responses/Error' }
        get:
            tags: [usuarios]
            operationId: listarUsuarios
            summary: Lista los usuarios
            description: Paginado y con orden. Se puede ordenar por id, email, nombre y creadoEl.
            parameters:
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size'
                - $ref: '#/components/parameters/Sort'
            responses:
                '200':
                    description: Página de usuarios
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PagedModel'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
    /api/usuarios/{id}:
        get:
            tags: [usuarios]
            operationId: obtenerUsuario
            summary: Obtiene un usuario por id
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: El usuario
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsuarioResponse'
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '404': { $ref: '#/components/responses/Error' }
    /api/usuarios/{id}/roles:
        put:
            tags: [usuarios]
            operationId: cambiarRoles
            summary: Reemplaza los roles de un usuario
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CambiarRolesRequest'
            responses:
                '200':
                    description: El usuario con sus nuevos roles
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsuarioResponse'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '404': { $ref: '#/components/responses/Error' }
    /api/auth/registro:
        post:
            tags: [auth]
            operationId: registrar
            summary: Registro público de un cliente
            description: Crea un usuario con el rol CLIENTE. Un correo ya registrado responde 409.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegistroRequest'
            responses:
                '201':
                    description: El usuario creado
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UsuarioResponse'
                '400': { $ref: '#/components/responses/Error' }
                '409': { $ref: '#/components/responses/Error' }
    /api/auth/login:
        post:
            tags: [auth]
            operationId: login
            summary: Inicia sesión y devuelve un JWT
            description: Credenciales inválidas responden 401 sin indicar si el correo existe.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Token de acceso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
components:
    parameters:
        Page:
            name: page
            in: query
            description: Número de página, desde 0
            schema: { type: integer, minimum: 0, default: 0 }
        Size:
            name: size
            in: query
            description: Elementos por página (máximo 100)
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        Sort:
            name: sort
            in: query
            description: "Orden en la convención de Spring: `campo,asc` o `campo,desc`. Campos: id, email, nombre, creadoEl. Por defecto creadoEl,desc"
            schema: { type: string }
    responses:
        Error:
            description: Error (400 inválido, 401 sin usuario, 403 sin permiso, 404 no existe, 409 conflicto)
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problema'
    schemas:
        Role:
            type: string
            description: Rol del usuario
            enum: [CLIENTE, ORGANIZADOR, ADMINISTRADOR, PERSONAL_ACCESO]
        CrearUsuarioRequest:
            type: object
            required: [email, nombre, password, roles]
            properties:
                email: { type: string, format: email, maxLength: 254 }
                nombre: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 72 }
                roles:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/Role'
        CambiarRolesRequest:
            type: object
            required: [roles]
            properties:
                roles:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/Role'
        RegistroRequest:
            type: object
            required: [email, nombre, password]
            properties:
                email: { type: string, format: email, maxLength: 254 }
                nombre: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 8, maxLength: 72 }
        LoginRequest:
            type: object
            required: [email, password]
            properties:
                email: { type: string }
                password: { type: string }
        TokenResponse:
            type: object
            required: [accessToken, tokenType, expiresIn]
            properties:
                accessToken: { type: string }
                tokenType: { type: string, example: Bearer }
                expiresIn: { type: integer, format: int64, description: Segundos hasta que expira }
        UsuarioResponse:
            type: object
            required: [id, email, nombre, roles, creadaEn, actualizadaEn]
            properties:
                id: { type: integer, format: int64 }
                email: { type: string }
                nombre: { type: string }
                roles:
                    type: array
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/Role'
                creadaEn: { type: string, format: date-time }
                actualizadaEn: { type: string, format: date-time }
        PagedModel:
            type: object
            description: Página en el formato de Spring Data
            required: [content, page]
            properties:
                content:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsuarioResponse'
                page:
                    type: object
                    properties:
                        size: { type: integer }
                        number: { type: integer }
                        totalElements: { type: integer, format: int64 }
                        totalPages: { type: integer }
        Problema:
            type: object
            properties:
                title: { type: string }
                status: { type: integer }
                detail: { type: string }
                correlationId: { type: string }
openapi: 3.0.3
info:
    title: ms-transacciones
    version: 1.0.0
    description: |
        Registro de transacciones de pago (débitos y créditos). Servicio interno: lo llama ms-devoluciones
        y no tiene ruta en el gateway. Requiere los headers X-User-Id (numérico) y X-User-Role.
        
        Solo el rol ORGANIZADOR accede, y solo a sus propias transacciones: organizadorId es el X-User-Id.
        
        Idempotencia: no puede haber dos transacciones con el mismo (ticketId, clienteId, organizadorId, estado).
        Repetir una solicitud devuelve la transacción original sin volver a llamar al procesador de pagos.
tags:
    - name: transacciones
paths:
    /api/transacciones/debitos:
        post:
            tags: [transacciones]
            operationId: generarDebito
            summary: Genera un débito
            description: Crea la transacción PENDIENTE, la envía al procesador y la deja COMPLETA o FALLIDA.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerarTransaccionRequest'
            responses:
                '201':
                    description: La transacción (nueva, o la original si la solicitud ya existía)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransaccionResponse'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '409': { $ref: '#/components/responses/Error' }
    /api/transacciones/creditos:
        post:
            tags: [transacciones]
            operationId: generarCredito
            summary: Genera un crédito
            description: Igual que el débito, pero con movimiento de CREDITO.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerarTransaccionRequest'
            responses:
                '201':
                    description: La transacción (nueva, o la original si la solicitud ya existía)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransaccionResponse'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '409': { $ref: '#/components/responses/Error' }
    /api/transacciones/{id}:
        get:
            tags: [transacciones]
            operationId: obtenerTransaccion
            summary: Obtiene una transacción por id
            description: Una transacción de otro organizador responde 404.
            parameters:
                - name: id
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
            responses:
                '200':
                    description: La transacción
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TransaccionResponse'
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
                '404': { $ref: '#/components/responses/Error' }
    /api/transacciones/ticket/{ticketId}:
        get:
            tags: [transacciones]
            operationId: buscarPorTicket
            summary: Busca las transacciones de un ticket y, opcionalmente, por tipo
            description: Paginado. Solo devuelve las del organizador que consulta.
            parameters:
                - name: ticketId
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - name: tipo
                  in: query
                  required: false
                  schema:
                      $ref: '#/components/schemas/TipoTransaccion'
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size'
                - $ref: '#/components/parameters/Sort'
            responses:
                '200':
                    description: Página de transacciones
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PagedModel'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
    /api/transacciones/organizador/{organizadorId}:
        get:
            tags: [transacciones]
            operationId: listarPorOrganizador
            summary: Lista las transacciones de un organizador
            description: Paginado y con orden. Un organizador solo puede pedir las suyas (403 si no).
            parameters:
                - name: organizadorId
                  in: path
                  required: true
                  schema: { type: integer, format: int64 }
                - $ref: '#/components/parameters/Page'
                - $ref: '#/components/parameters/Size'
                - $ref: '#/components/parameters/Sort'
            responses:
                '200':
                    description: Página de transacciones
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PagedModel'
                '400': { $ref: '#/components/responses/Error' }
                '401': { $ref: '#/components/responses/Error' }
                '403': { $ref: '#/components/responses/Error' }
components:
    parameters:
        Page:
            name: page
            in: query
            description: Número de página, desde 0
            schema: { type: integer, minimum: 0, default: 0 }
        Size:
            name: size
            in: query
            description: Elementos por página (máximo 100)
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        Sort:
            name: sort
            in: query
            description: "Orden en la convención de Spring: `campo,asc` o `campo,desc`. Campos: id, createdAt, monto, estado. Por defecto createdAt,desc"
            schema: { type: string }
    responses:
        Error:
            description: Error (400 inválido, 401 sin usuario, 403 sin permiso, 404 no existe, 409 conflicto)
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problema'
    schemas:
        TipoTransaccion:
            type: string
            enum: [DEBITO, CREDITO]
        EstadoTransaccion:
            type: string
            enum: [PENDIENTE, COMPLETA, FALLIDA]
        GenerarTransaccionRequest:
            type: object
            required: [ticketId, clienteId, monto]
            properties:
                ticketId: { type: integer, format: int64 }
                clienteId: { type: integer, format: int64 }
                monto:
                    type: number
                    format: double
                    minimum: 0
                    exclusiveMinimum: true
        TransaccionResponse:
            type: object
            required: [id, tipo, estado, monto, clienteId, organizadorId, ticketId, creadoEl, actualizadoEl]
            properties:
                id: { type: integer, format: int64 }
                tipo:
                    $ref: '#/components/schemas/TipoTransaccion'
                estado:
                    $ref: '#/components/schemas/EstadoTransaccion'
                monto: { type: number, format: double }
                clienteId: { type: integer, format: int64 }
                organizadorId: { type: integer, format: int64 }
                ticketId: { type: integer, format: int64 }
                motivoFallo: { type: string }
                creadoEl: { type: string, format: date-time }
                actualizadoEl: { type: string, format: date-time }
        PagedModel:
            type: object
            description: Página en el formato de Spring Data (org.springframework.data.web.PagedModel)
            required: [content, page]
            properties:
                content:
                    type: array
                    items:
                        $ref: '#/components/schemas/TransaccionResponse'
                page:
                    type: object
                    properties:
                        size: { type: integer }
                        number: { type: integer }
                        totalElements: { type: integer, format: int64 }
                        totalPages: { type: integer }
        Problema:
            type: object
            properties:
                title: { type: string }
                status: { type: integer }
                detail: { type: string }
                correlationId: { type: string }
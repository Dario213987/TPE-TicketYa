openapi: 3.0.3
info:
  title: ms-transacciones
  version: 1.0.0
  description: |
    Registro de transacciones (cobros y reintegros). Servicio interno (por el momento(?): lo consumen ms-tickets y
    ms-devoluciones y no tiene ruta en el gateway.
    Un DÉBITO es un movimiento de ENTRADA (se cobra al cliente) y un CRÉDITO es un movimiento de SALIDA
    (se reintegra). Toda transacción pertenece a un organizador y a un cliente, y tiene un ticket asociado.
    Requiere los headers X-User-Id y X-User-Role.
tags:
  - name: transacciones
paths:
  /api/transacciones/debitos:
    post:
      tags: [transacciones]
      operationId: debitar
      summary: Cobra uno o más tickets (movimiento de ENTRADA)
      description: |
        Síncrono. Crea una transacción PENDIENTE por ticket, la envía a la pasarela y responde con el resultado
        final (COMPLETA o FALLIDA). Si la pasarela no responde, la transacción queda PENDIENTE (resultado incierto).
        Idempotente por `Idempotency-Key`: un reintento devuelve las transacciones originales (200) sin cobrar de nuevo.
        Un ticket solo admite un cobro no fallido (409 si ya lo tiene).
        Rol requerido: ORGANIZADOR, y solo sobre sus propios tickets.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitosRequest'
      responses:
        '201':
          description: Se creó al menos una transacción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitosResponse'
        '200':
          description: La clave ya existía; se devuelven las transacciones originales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitosResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/transacciones/creditos:
    post:
      tags: [transacciones]
      operationId: acreditar
      summary: Reintegra uno o más tickets (movimiento de SALIDA)
      description: |
        Asíncrono. Acepta el lote (202) y crea una transacción PENDIENTE por ticket, con el monto, el cliente y
        el organizador del cobro original. Un procesador las envía a la pasarela y, al terminar, ms-transacciones
        informa el resultado al servicio indicado en `origen` (entrega "al menos una vez").
        Un ticket sin cobro completado, o ya reintegrado, se informa en `error` sin afectar a los demás.
        Idempotente por `Idempotency-Key`.
        Rol requerido: ORGANIZADOR, y solo sobre sus propios tickets.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditosRequest'
      responses:
        '202':
          description: Lote aceptado. Hay un resultado por ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditosResponse'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
  /api/transacciones/{id}:
    get:
      tags: [transacciones]
      operationId: obtenerTransaccion
      summary: Obtiene una transacción por id
      description: |
        ADMINISTRADOR ve cualquiera; ORGANIZADOR y CLIENTE solo las propias (una ajena responde 404).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: La transacción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransaccionResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identifica la operación. Reenviar la misma clave devuelve el resultado original.
      schema:
        type: string
        minLength: 8
        maxLength: 100
  responses:
    SolicitudInvalida:
      description: Body o parámetros inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: Faltan los headers X-User-Id o X-User-Role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SinPermiso:
      description: El rol no tiene permiso para esta operación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflicto:
      description: Conflicto de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    MedioPago:
      type: string
      enum: [TARJETA_CREDITO, TARJETA_DEBITO, TRANSFERENCIA]
    TipoMovimiento:
      type: string
      enum: [ENTRADA, SALIDA]
    EstadoTransaccion:
      type: string
      enum: [PENDIENTE, COMPLETA, FALLIDA]
    Origen:
      type: string
      description: Servicio que pidió la operación y que recibe el resultado
      enum: [TICKETS, DEVOLUCIONES]
    DebitoItem:
      type: object
      required: [ticketId, clienteId, organizadorId, monto, medioPago]
      properties:
        ticketId:
          type: string
          minLength: 1
          maxLength: 64
        clienteId:
          type: string
          minLength: 1
          maxLength: 64
        organizadorId:
          type: string
          minLength: 1
          maxLength: 64
        monto:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
          description: Máximo 2 decimales
        medioPago:
          $ref: '#/components/schemas/MedioPago'
    DebitosRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/DebitoItem'
    DebitosResponse:
      type: object
      required: [transacciones]
      properties:
        transacciones:
          type: array
          items:
            $ref: '#/components/schemas/TransaccionResponse'
    CreditoItem:
      type: object
      required: [ticketId]
      properties:
        ticketId:
          type: string
          minLength: 1
          maxLength: 64
    CreditosRequest:
      type: object
      required: [origen, items]
      properties:
        origen:
          $ref: '#/components/schemas/Origen'
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CreditoItem'
    ResultadoItemCredito:
      type: object
      required: [ticketId]
      properties:
        ticketId:
          type: string
        transaccion:
          $ref: '#/components/schemas/TransaccionResponse'
        error:
          type: string
          description: Motivo por el que no se pudo reintegrar este ticket
    CreditosResponse:
      type: object
      required: [resultados]
      properties:
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/ResultadoItemCredito'
    TransaccionResponse:
      type: object
      required: [id, tipo, estado, monto, medioPago, clienteId, organizadorId, ticketId, origen, creadaEn, actualizadaEn]
      properties:
        id:
          type: integer
          format: int64
        tipo:
          $ref: '#/components/schemas/TipoMovimiento'
        estado:
          $ref: '#/components/schemas/EstadoTransaccion'
        monto:
          type: number
        medioPago:
          $ref: '#/components/schemas/MedioPago'
        clienteId:
          type: string
        organizadorId:
          type: string
        ticketId:
          type: string
        transaccionOriginalId:
          type: integer
          format: int64
          description: Solo en los reintegros (SALIDA)
        origen:
          $ref: '#/components/schemas/Origen'
        motivoFallo:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
    Problema:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
    ErrorCampo:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
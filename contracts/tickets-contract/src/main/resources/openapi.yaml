openapi: 3.0.3
info:
  title: ms-tickets
  version: 1.0.0
  description: |
    Gestion de disponibilidad y reservas de entradas. Requiere los headers X-User-Id (numerico)
    y X-User-Role. El gateway expone estas rutas bajo /api/tickets.

    Roles:
    - CLIENTE: puede reservar entradas.
    - ORGANIZADOR y ADMINISTRADOR: pueden publicar la disponibilidad de un evento.
    - La consulta de disponibilidad es publica.

    Las reservas vencidas se liberan de forma perezosa antes de reservar y antes de consultar
    la disponibilidad. Ademas, un job periodico libera todas las reservas cuyo tiempo expiro.
    El job usa un bloqueo distribuido para que, si hay varias instancias, solo una libere cada
    reserva.

    Para eventos de alta demanda con habilitacion por tandas, un job periodico habilita a los
    primeros N clientes de la fila y les emite un pase con TTL. Mientras la habilitacion este
    activa, reservar requiere un pase vigente. La coordinacion entre instancias se hace en la
    base (claim atomico de la proxima tanda) y en Redis (ZPOPMIN y emision del pase en un unico
    script Lua), por lo que varias instancias nunca duplican ni saltean clientes. El cliente
    puede abandonar la fila; si tenia un pase, se descarta. Los pases que vencen sin uso se
    descartan y el job habilita al siguiente cliente de la cola.
tags:
  - name: reservas
  - name: disponibilidad
  - name: fila
  - name: interno
paths:
  /api/tickets/eventos/{eventoId}/reservas:
    post:
      tags: [reservas]
      operationId: reservarEntradas
      summary: Reserva asientos de un sector para el cliente autenticado
      description: |
        Solo el rol CLIENTE puede reservar. El cliente se toma de X-User-Id, nunca del cuerpo.
        Respeta el limite de entradas por cliente del evento (o el configurado por defecto).

        Se puede reservar asientos especificos enviando asientos (fila y numero). En ese caso
        la reserva es todo o nada: si alguno de los asientos ya no esta LIBRE responde 409 y
        no reserva ninguno. La restriccion unica sobre tickets.asiento_id garantiza que, ante
        reservas concurrentes del mismo asiento, solo una pueda completarse.

        Si no se envian asientos, se mantiene el comportamiento por cantidad: en sectores
        numerados asigna los primeros asientos libres; en no numerados descuenta los disponibles.

        El evento debe tener la disponibilidad publicada; si no, responde 409. Las reservas
        quedan vigentes durante 10 minutos (hasta expiraEl) y devuelven el idReserva.

        Si el evento es de alta demanda y tiene la habilitacion por tandas activa, el cliente
        debe estar habilitado: se valida el pase emitido para su X-User-Id (y opcionalmente el
        paseToken enviado en el cuerpo). Si no tiene pase o vencio, responde 409.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaRequestDTO'
      responses:
        '201':
          description: La reserva creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponseDTO'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/tickets/eventos/{eventoId}/fila:
    get:
      tags: [fila]
      operationId: consultarPosicionFila
      summary: Consulta la posición del cliente en la fila virtual
      description: |
        Solo el rol CLIENTE puede consultar su posición. El cliente se toma de
        X-User-Id, nunca del cuerpo.

        Pensado para polling frecuente: solo lee Redis y no consulta la base de
        datos. Si el cliente no está en la fila responde 404.

        Si el cliente ya fue habilitado por una tanda, responde estado HABILITADO
        con el pase vigente (token, tanda y expiraEl) en lugar de la posicion.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: El cliente está en la fila o ya tiene un pase vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosicionFilaResponseDTO'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [fila]
      operationId: entrarEnFila
      summary: Reserva un turno en la fila virtual de un evento de alta demanda
      description: |
        Solo el rol CLIENTE puede entrar a la fila. El cliente se toma de X-User-Id,
        nunca del cuerpo.

        El evento debe tener la disponibilidad publicada, estar marcado como
        altaDemanda y tener la venta abierta. Si no tiene disponibilidad responde
        404; si tiene disponibilidad pero no es de alta demanda o la venta no está
        ABIERTA responde 409.

        La fila se guarda en un sorted set de Redis ordenado por el momento de
        llegada. La operación es idempotente: si el cliente ya está en la fila,
        no se duplica ni se modifica su posición y responde 200. Si es la primera
        vez, responde 201.

        Si el cliente ya tiene un pase vigente, no se reinserta en la fila y
        responde 200 con estado HABILITADO y el pase. La comprobación del pase y
        la inserción en la cola son atómicas respecto de la emisión de tandas.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: El cliente ya estaba en la fila; se devuelve su posición actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnoFilaResponseDTO'
        '201':
          description: El cliente ingresó a la fila
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnoFilaResponseDTO'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [fila]
      operationId: salirDeLaFila
      summary: Saca al cliente de la fila virtual
      description: |
        Solo el rol CLIENTE puede abandonar la fila. El cliente se toma de
        X-User-Id, nunca del cuerpo.

        Elimina al cliente de la cola sin modificar el orden de los demas. Si
        ya tenia un pase vigente, tambien lo descarta para liberar el lugar.
        Es idempotente: responde 204 aunque el cliente ya no estuviera en la
        fila.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: El cliente salió de la fila o ya no estaba
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/tickets/eventos/{eventoId}/disponibilidad:
    post:
      tags: [disponibilidad]
      operationId: publicarDisponibilidad
      summary: Publica la disponibilidad de un evento
      description: |
        Solo los roles ORGANIZADOR y ADMINISTRADOR pueden publicar. El eventoId del path debe
        coincidir con el del cuerpo.

        Es idempotente por evento: si el evento ya tenia disponibilidad, no se recrean los
        sectores existentes, pero si se procesan los sectores nuevos y se actualiza el limite
        de entradas por cliente. El flag altaDemanda solo se define en la primera publicacion;
        si se intenta cambiar despues responde 409. En ese caso responde 200 con
        yaExistia=true; si es la primera publicacion responde 201 con yaExistia=false.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarEventoRequestDTO'
      responses:
        '200':
          description: La disponibilidad ya existia; se procesaron los sectores nuevos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponseDTO'
        '201':
          description: La disponibilidad fue creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponseDTO'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    get:
      tags: [disponibilidad]
      operationId: consultarDisponibilidad
      summary: Consulta la disponibilidad de un evento
      description: |
        Devuelve los sectores y, en sectores numerados, el detalle de los asientos. Antes de
        responder libera las reservas vencidas del evento para reflejar la disponibilidad real.
        Responde 404 si el evento no tiene disponibilidad publicada.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: La disponibilidad del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadEventoResponseDTO'
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/cancelar:
    put:
      tags: [interno]
      operationId: cancelarVenta
      summary: Cancela la venta de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Pasa estado_venta a CANCELADA. Es idempotente. No requiere headers de usuario.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Estado actualizado }
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/suspender:
    put:
      tags: [interno]
      operationId: suspenderVenta
      summary: Suspende la venta de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Pasa estado_venta a SUSPENDIDA. Es idempotente. No requiere headers de usuario.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Estado actualizado }
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/reactivar:
    put:
      tags: [interno]
      operationId: reactivarVenta
      summary: Reactiva la venta de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Pasa estado_venta a ABIERTA. Es idempotente. No requiere headers de usuario.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Estado actualizado }
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/finalizar:
    put:
      tags: [interno]
      operationId: finalizarVenta
      summary: Finaliza la venta de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Pasa estado_venta a FINALIZADA. Es idempotente. No requiere headers de usuario.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Estado actualizado }
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/habilitacion:
    put:
      tags: [interno]
      operationId: configurarHabilitacion
      summary: Ajusta la habilitación por tandas de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Permite activar o desactivar la habilitación y ajustar el tamaño de tanda, el
        intervalo entre tandas y el TTL del pase. Solo existe configuración para eventos
        de alta demanda con la disponibilidad publicada; si no, responde 404.

        Los cambios de tamaño, intervalo y TTL aplican a las próximas tandas.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabilitacionRequestDTO'
      responses:
        '204': { description: Configuración actualizada }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/tickets/internal/eventos/{eventoId}/compradores:
    get:
      tags: [interno]
      operationId: listarCompradoresEvento
      summary: Lista los compradores de un evento
      description: |
        Endpoint interno servicio-a-servicio; el gateway bloquea /api/tickets/internal/**.
        Devuelve los identificadores de usuario distintos que compraron al menos una
        entrada para el evento. Se consideran compras los tickets en estado EMITIDO,
        USADO o DEVUELTO; se excluyen RESERVADO, CANCELADO, EXPIRADO y LIBERADO.

        Un evento sin compras devuelve una lista vacia, no 404. No requiere headers de
        usuario. Pensado para que otro microservicio arme avisos masivos a los compradores.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Identificadores de usuario distintos, ordenados de menor a mayor
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
components:
  responses:
    Error:
      description: Error (400 invalido, 401 sin usuario, 403 sin permiso, 404 no existe, 409 conflicto)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    TipoSector:
      type: string
      enum: [NUMERADO, NO_NUMERADO]
    EstadoDisponibilidad:
      type: string
      enum: [LIBRE, RESERVADO, VENDIDO]
    EstadoFila:
      type: string
      enum: [EN_ESPERA, HABILITADO]
      description: |
        EN_ESPERA: el cliente está en la cola. HABILITADO: el cliente recibió un pase
        temporal y puede reservar mientras no venza.
    PaseDTO:
      type: object
      nullable: true
      required: [token, tanda, expiraEl]
      properties:
        token:
          type: string
          description: Token del pase; se puede enviar como paseToken al reservar.
        tanda:
          type: string
          description: Identificador de la tanda que emitió el pase.
        expiraEl:
          type: string
          format: date-time
          description: Momento en que el pase deja de ser válido. La ventana es el TTL configurado.
    HabilitacionRequestDTO:
      type: object
      description: |
        Todos los campos son opcionales; solo se actualizan los informados.
      properties:
        habilitada:
          type: boolean
          description: Activa o desactiva la exigencia de pase para el evento.
        tamanoTanda:
          type: integer
          minimum: 1
          description: Cantidad de clientes habilitados en cada tanda.
        intervaloSegundos:
          type: integer
          minimum: 1
          description: Segundos entre el inicio de una tanda y la siguiente.
        ttlPaseSegundos:
          type: integer
          minimum: 1
          description: Segundos que un pase permanece válido desde su emisión.
    AsientoDTO:
      type: object
      required: [fila, numero]
      properties:
        fila:
          type: integer
          minimum: 1
        numero:
          type: integer
          minimum: 1
    AsientoDisponibilidadDTO:
      type: object
      required: [fila, numero, estado]
      properties:
        fila: { type: integer }
        numero: { type: integer }
        estado:
          $ref: '#/components/schemas/EstadoDisponibilidad'
    SectorDisponibilidadDTO:
      type: object
      required: [sectorId, tipo]
      description: |
        Para sectores NO_NUMERADO se exige capacidadMaxima. Para sectores NUMERADO se exige
        asientos, o bien filas y asientosPorFila para generarlos.
      properties:
        sectorId: { type: integer, format: int64 }
        tipo:
          $ref: '#/components/schemas/TipoSector'
        capacidadMaxima:
          type: integer
          minimum: 1
        asientos:
          type: array
          items:
            $ref: '#/components/schemas/AsientoDTO'
        filas:
          type: integer
          minimum: 1
        asientosPorFila:
          type: integer
          minimum: 1
    SectorDisponibilidadResponseDTO:
      type: object
      required: [sectorId, tipoSector, capacidadTotal, disponibles]
      properties:
        sectorId: { type: integer, format: int64 }
        tipoSector:
          $ref: '#/components/schemas/TipoSector'
        capacidadTotal: { type: integer }
        disponibles: { type: integer }
        asientos:
          type: array
          nullable: true
          description: Solo se informa en sectores NUMERADO
          items:
            $ref: '#/components/schemas/AsientoDisponibilidadDTO'
    PublicarEventoRequestDTO:
      type: object
      required: [eventoId, sectores]
      properties:
        eventoId: { type: integer, format: int64 }
        limiteEntradasPorCliente:
          type: integer
          minimum: 1
        altaDemanda:
          type: boolean
          default: false
          description: Habilita la fila virtual del evento en ms-tickets.
        sectores:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SectorDisponibilidadDTO'
    DisponibilidadResponseDTO:
      type: object
      required: [eventoId, yaExistia, sectoresProcesados, asientosInsertados, asientosOmitidos, creadoEl]
      properties:
        eventoId: { type: integer, format: int64 }
        yaExistia: { type: boolean }
        altaDemanda: { type: boolean }
        sectoresProcesados: { type: integer }
        asientosInsertados: { type: integer }
        asientosOmitidos: { type: integer }
        creadoEl: { type: string, format: date-time }
    DisponibilidadEventoResponseDTO:
      type: object
      required: [eventoId, limiteEntradasPorCliente, sectores]
      properties:
        eventoId: { type: integer, format: int64 }
        limiteEntradasPorCliente: { type: integer }
        altaDemanda: { type: boolean }
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/SectorDisponibilidadResponseDTO'
    ReservaRequestDTO:
      type: object
      required: [sectorId]
      description: |
        Se debe informar asientos, o bien cantidad. Si se informan asientos, cantidad es
        opcional y se calcula a partir de la lista.
      properties:
        sectorId: { type: integer, format: int64 }
        cantidad:
          type: integer
          minimum: 1
        asientos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AsientoDTO'
        paseToken:
          type: string
          description: |
            Opcional. Token del pase obtenido en la fila. Si el evento usa habilitación
            por tandas, se valida contra el pase emitido para el X-User-Id.
    ReservaResponseDTO:
      type: object
      required: [idReserva, eventoId, clienteId, sectorId, cantidad, limiteEntradasPorCliente, entradasVigentes, expiraEl, codigosQr]
      properties:
        idReserva: { type: integer, format: int64 }
        eventoId: { type: integer, format: int64 }
        clienteId: { type: integer, format: int64 }
        sectorId: { type: integer, format: int64 }
        cantidad: { type: integer }
        limiteEntradasPorCliente: { type: integer }
        entradasVigentes: { type: integer, format: int64 }
        expiraEl: { type: string, format: date-time }
        codigosQr:
          type: array
          items: { type: string }
        asientos:
          type: array
          nullable: true
          description: Asientos reservados; solo se informa cuando la reserva fue de asientos especificos o en sectores numerados
          items:
            $ref: '#/components/schemas/AsientoDisponibilidadDTO'
    TurnoFilaResponseDTO:
      type: object
      required: [eventoId, clienteId, totalEnFila, yaEstabaEnFila, estado]
      properties:
        eventoId: { type: integer, format: int64 }
        clienteId: { type: integer, format: int64 }
        posicion:
          type: integer
          format: int64
          nullable: true
          description: Posición actual en la fila, empezando en 1. Es null cuando el cliente ya está HABILITADO.
        totalEnFila:
          type: integer
          format: int64
          description: Cantidad de clientes en la fila al momento de la consulta.
        yaEstabaEnFila:
          type: boolean
          description: true si el cliente ya tenía un turno o un pase y se conservó su lugar.
        ingresadoEl:
          type: string
          format: date-time
          description: Momento en que el cliente ingresó a la fila, o en que se emitió el pase si está HABILITADO.
        estado:
          $ref: '#/components/schemas/EstadoFila'
        pase:
          $ref: '#/components/schemas/PaseDTO'
    PosicionFilaResponseDTO:
      type: object
      required: [eventoId, clienteId, totalEnFila, estado]
      properties:
        eventoId: { type: integer, format: int64 }
        clienteId: { type: integer, format: int64 }
        posicion:
          type: integer
          format: int64
          nullable: true
          description: Posición actual en la fila, empezando en 1. Es null cuando el cliente ya está HABILITADO.
        personasDelante:
          type: integer
          format: int64
          nullable: true
          description: Cantidad de personas delante del cliente (posicion - 1). Es null cuando el cliente ya está HABILITADO.
        totalEnFila:
          type: integer
          format: int64
          description: Cantidad de clientes en la fila al momento de la consulta.
        estado:
          $ref: '#/components/schemas/EstadoFila'
        pase:
          $ref: '#/components/schemas/PaseDTO'
    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

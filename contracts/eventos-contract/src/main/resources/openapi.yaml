    PagedEventos:
      type: object
      description: Página en el formato de Spring Data (Page serializada como DTO)
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventoResumen'
        page:
          type: object
          properties:

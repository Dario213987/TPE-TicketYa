          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    PrecioEventoSectorResponse:
      type: object
      required: [eventoId, sectorId, precio]
      properties:
        eventoId: { type: integer, format: int64 }
        sectorId: { type: integer, format: int64 }
        precio: { type: number, format: double }
    PagedLugares:
      type: object
      description: Página en el formato de Spring Data (Page serializada como DTO)
      required: [content, page]
      properties:
        content:
          type: array

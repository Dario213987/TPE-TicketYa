openapi: 3.0.3
info:
  title: ms-eventos
  version: 1.0.0
  description: |
    Administración de lugares, sectores y eventos. Requiere los headers X-User-Id y X-User-Role.
    Los endpoints de consulta de lugares requieren rol ORGANIZADOR y los de creación rol ADMINISTRADOR.
tags:
  - name: lugares
  - name: sectores
paths:
  /api/lugares:
    get:
      tags: [lugares]
      operationId: listarLugares
      summary: Lista los lugares, opcionalmente filtrados por ciudad
      description: Paginado. Ordenado por nombre por defecto.
      parameters:
        - name: ciudad
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de lugares con sus sectores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLugares'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [lugares]
      operationId: crearLugar
      summary: Crea un lugar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LugarCreateRequest'
      responses:
        '201':
          description: El lugar creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/lugares/{id}:
    get:
      tags: [lugares]
      operationId: obtenerLugar
      summary: Obtiene un lugar por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: El lugar con sus sectores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarDetalleResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/lugares/{lugarId}/sectores/numerados:
    post:
      tags: [sectores]
      operationId: crearSectorNumerado
      summary: Crea un sector numerado en un lugar
      description: Genera los asientos a partir de la cantidad de filas y asientos por fila.
      parameters:
        - name: lugarId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorNumeradoRequest'
      responses:
        '201':
          description: El sector creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/lugares/{lugarId}/sectores/no-numerados:
    post:
      tags: [sectores]
      operationId: crearSectorNoNumerado
      summary: Crea un sector no numerado en un lugar
      parameters:
        - name: lugarId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorNoNumeradoRequest'
      responses:
        '201':
          description: El sector creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Page:
      name: page
      in: query
      description: Número de página, desde 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Elementos por página (máximo 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Sort:
      name: sort
      in: query
      description: "Orden en la convención de Spring: `campo,asc` o `campo,desc`. Campos: id, nombre, ciudad. Por defecto nombre,asc"
      schema: { type: string }
  responses:
    Error:
      description: Error (400 inválido, 401 sin usuario, 403 sin permiso, 404 no existe)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    TipoSector:
      type: string
      enum: [NUMERADO, NO_NUMERADO]
    LugarCreateRequest:
      type: object
      required: [nombre, tipo, direccion, ciudad, latitud, longitud]
      properties:
        nombre: { type: string }
        tipo: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
        capacidad:
          type: integer
          minimum: 0
    LugarResponse:
      type: object
      required: [id, nombre, tipo, direccion, ciudad, latitud, longitud]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        tipo: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
    LugarDetalleResponse:
      type: object
      required: [id, nombre, tipo, direccion, ciudad, latitud, longitud, sectores]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        tipo: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'
    SectorNumeradoRequest:
      type: object
      required: [nombre, precio, filas, asientosPorFila]
      properties:
        nombre: { type: string }
        precio:
          type: number
          format: double
          minimum: 0
        filas:
          type: integer
          minimum: 1
        asientosPorFila:
          type: integer
          minimum: 1
    SectorNoNumeradoRequest:
      type: object
      required: [nombre, precio, capacidadMaxima]
      properties:
        nombre: { type: string }
        precio:
          type: number
          format: double
          minimum: 0
        capacidadMaxima:
          type: integer
          minimum: 1
    SectorResponse:
      type: object
      required: [id, nombre, precio, tipoSector]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        precio: { type: number, format: double }
        tipoSector:
          $ref: '#/components/schemas/TipoSector'
        capacidad: { type: integer }
        capacidadMaxima: { type: integer }
        filas: { type: integer }
        asientosPorFila: { type: integer }
    PagedLugares:
      type: object
      description: Página en el formato de Spring Data (Page serializada como DTO)
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/LugarDetalleResponse'
        page:
          type: object
          properties:
            size: { type: integer }
            number: { type: integer }
            totalElements: { type: integer, format: int64 }
            totalPages: { type: integer }
    Problema:
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

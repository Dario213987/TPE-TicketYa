openapi: 3.0.3
info:
  title: ms-eventos
  version: 1.0.0
  description: |
    Administración de lugares, sectores y eventos. Requiere los headers X-User-Id y X-User-Role.
    Los endpoints de consulta de lugares requieren rol ORGANIZADOR y los de creación rol ADMINISTRADOR.
tags:
  - name: eventos
  - name: lugares
  - name: sectores
paths:
  /api/eventos:
    get:
      tags: [eventos]
      operationId: listarEventos
      summary: Lista los eventos visibles
      description: |
        Paginado. Devuelve únicamente eventos PUBLICADO o AGOTADO. Sin `orden`, si viene `sort`
        se respeta el orden legado; si no, ordena por fecha ascendente y desempata por id.
        Si se envían ambos, `orden` tiene prioridad. Los filtros presentes se combinan con AND.
      parameters:
        - $ref: '#/components/parameters/TipoEventoFiltro'
        - $ref: '#/components/parameters/OrganizadorIdFiltro'
        - $ref: '#/components/parameters/ParticipanteFiltro'
        - $ref: '#/components/parameters/CiudadFiltro'
        - $ref: '#/components/parameters/FechaDesdeFiltro'
        - $ref: '#/components/parameters/FechaHastaFiltro'
        - $ref: '#/components/parameters/Orden'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/EventosSize'
      responses:
        '200':
          description: Página de eventos visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEventos'
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [eventos]
      operationId: crearEventoBorrador
      summary: Crea un evento en estado BORRADOR
      description: El organizador del evento se obtiene del header X-User-Id. Los borradores no aparecen en la consulta pública.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoBorradorCreateRequest'
      responses:
        '201':
          description: El evento creado en estado BORRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}:
    get:
      tags: [eventos]
      operationId: obtenerEvento
      summary: Devuelve el detalle de un evento
      description: |
        Endpoint público. Devuelve el detalle de un evento con su lugar, participantes,
        sectores y precios. Los eventos en BORRADOR solo los puede ver su organizador o un
        administrador; para el resto responde 404. La disponibilidad por sector no forma
        parte del detalle: se consulta en GET /api/eventos/{eventoId}/disponibilidad.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: El detalle del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalleResponse'
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [eventos]
      operationId: actualizarEvento
      summary: Modifica un evento
      description: |
        Permite corregir los datos de un borrador propio (o de cualquier borrador si el usuario
        es administrador). En eventos ya publicados solo se pueden modificar los campos no
        estructurales; para cambiar lugar, fecha o sectores hay que cancelar o reprogramar.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoUpdateRequest'
      responses:
        '200':
          description: El evento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [eventos]
      operationId: eliminarEvento
      summary: Elimina un borrador
      description: Solo se pueden eliminar eventos en estado BORRADOR. Un evento publicado no se elimina.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '204':
          description: Evento eliminado
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}/publicar:
    put:
      tags: [eventos]
      operationId: publicarEvento
      summary: Publica un evento en borrador
      description: |
        Solo el organizador dueño del evento o un administrador. Pasa el evento de BORRADOR
        a PUBLICADO, validando fecha, lugar, sectores y precios, y crea la disponibilidad
        en ms-tickets. Es idempotente si el evento ya está publicado.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: El evento publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}/cancelar:
    post:
      tags: [eventos]
      operationId: cancelarEvento
      summary: Cancela un evento
      description: |
        Solo administradores. El evento puede estar PUBLICADO, SUSPENDIDO o AGOTADO. Pasa el
        evento a CANCELADO, bloquea nuevas reservas y compras en ms-tickets y dispara el
        reintegro masivo (US-07.05) delegando en ms-devoluciones. Si ms-tickets o
        ms-devoluciones no están disponibles o responden con error, la cancelación no se
        persiste y se devuelve 502.
        Es idempotente si el evento ya está cancelado.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '202':
          description: El evento cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}/suspender:
    put:
      tags: [eventos]
      operationId: suspenderEvento
      summary: Suspende un evento
      description: |
        Solo administradores. El evento puede estar PUBLICADO o AGOTADO. Pasa el evento a
        SUSPENDIDO y bloquea nuevas reservas y compras en ms-tickets. No dispara el reintegro
        masivo. Es idempotente si el evento ya está suspendido.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: El evento suspendido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}/reactivar:
    put:
      tags: [eventos]
      operationId: reactivarEvento
      summary: Reactiva un evento suspendido
      description: |
        Solo administradores. Pasa el evento de SUSPENDIDO a PUBLICADO o AGOTADO según la
        disponibilidad informada por ms-tickets y habilita nuevamente reservas y compras.
        Es idempotente si el evento ya está publicado o agotado.
      parameters:
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: El evento reactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/eventos/internal/{id}/estado/agotado:
    put:
      tags: [eventos]
      operationId: marcarEventoAgotado
      summary: Marca un evento como AGOTADO
      description: |
        Endpoint interno de integración para pasar un evento PUBLICADO a AGOTADO.
        Es idempotente si el evento ya está agotado. No requiere autenticación.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: El evento agotado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/eventos/internal/{id}/estado/publicar:
    put:
      tags: [eventos]
      operationId: marcarEventoPublicado
      summary: Vuelve a publicar un evento AGOTADO
      description: |
        Endpoint interno de integración para pasar un evento AGOTADO a PUBLICADO.
        Es idempotente si el evento ya está publicado. No requiere autenticación.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: El evento publicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoEstadoResponse'
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/eventos/internal/finalizar-vencidos:
    put:
      tags: [eventos]
      operationId: finalizarEventosVencidos
      summary: Finaliza los eventos vencidos
      description: |
        Endpoint interno para disparar manualmente el proceso de finalización.
        Pasa a FINALIZADO los eventos PUBLICADO, AGOTADO o SUSPENDIDO cuya
        fecha/hora sea anterior al momento actual menos 6 horas.
        No requiere autenticación.
      responses:
        '204':
          description: Proceso ejecutado
  /api/lugares:
    get:
      tags: [lugares]
      operationId: listarLugares
      summary: Lista los lugares, opcionalmente filtrados por ciudad
      description: Paginado. Ordenado por nombre por defecto.
      parameters:
        - name: ciudad
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de lugares con sus sectores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLugares'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [lugares]
      operationId: crearLugar
      summary: Crea un lugar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LugarCreateRequest'
      responses:
        '201':
          description: El lugar creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/lugares/{id}:
    get:
      tags: [lugares]
      operationId: obtenerLugar
      summary: Obtiene un lugar por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: El lugar con sus sectores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LugarDetalleResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/lugares/{lugarId}/sectores/numerados:
    post:
      tags: [sectores]
      operationId: crearSectorNumerado
      summary: Crea un sector numerado en un lugar
      description: Genera los asientos a partir de la cantidad de filas y asientos por fila.
      parameters:
        - name: lugarId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorNumeradoRequest'
      responses:
        '201':
          description: El sector creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/lugares/{lugarId}/sectores/no-numerados:
    post:
      tags: [sectores]
      operationId: crearSectorNoNumerado
      summary: Crea un sector no numerado en un lugar
      parameters:
        - name: lugarId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectorNoNumeradoRequest'
      responses:
        '201':
          description: El sector creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/eventos/{eventoId}/sectores/{sectorId}/precio:
    put:
      tags: [eventos]
      operationId: definirPrecioSector
      summary: Define el precio de un sector para un evento
      description: |
        Solo se pueden definir precios en eventos en estado BORRADOR y sobre sectores
        que pertenezcan al lugar del evento. El organizador debe ser dueño del evento.
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: sectorId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrecioEventoSectorRequest'
      responses:
        '200':
          description: El precio guardado para el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrecioEventoSectorResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Page:
      name: page
      in: query
      description: Número de página, desde 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Elementos por página (máximo 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    EventosSize:
      name: size
      in: query
      description: Elementos por página (máximo 50)
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Sort:
      name: sort
      in: query
      deprecated: true
      description: |
        Parámetro legado en la convención de Spring: `campo,asc` o `campo,desc`.
        Campos válidos para eventos: id, nombre, fecha, tipo. Se ignora si se envía `orden`.
      schema: { type: string }
    TipoEventoFiltro:
      name: tipo
      in: query
      description: Tipo de evento. La comparación no distingue mayúsculas/minúsculas. Un valor inválido devuelve 400.
      schema:
        $ref: '#/components/schemas/TipoEvento'
    OrganizadorIdFiltro:
      name: organizadorId
      in: query
      description: Filtra por el id del organizador del evento.
      schema: { type: integer, format: int64 }
    ParticipanteFiltro:
      name: participante
      in: query
      description: Nombre de un participante/artista. Coincidencia exacta, no parcial, sin distinguir mayúsculas ni tildes.
      schema: { type: string }
    CiudadFiltro:
      name: ciudad
      in: query
      description: Filtra por la ciudad del lugar sin distinguir mayúsculas/minúsculas.
      schema: { type: string }
    FechaDesdeFiltro:
      name: fechaDesde
      in: query
      description: Fecha mínima inclusive del evento, en formato ISO-8601 (yyyy-MM-dd).
      schema:
        type: string
        format: date
        example: '2026-12-01'
    FechaHastaFiltro:
      name: fechaHasta
      in: query
      description: Fecha máxima inclusive del evento, en formato ISO-8601 (yyyy-MM-dd).
      schema:
        type: string
        format: date
        example: '2026-12-31'
    Orden:
      name: orden
      in: query
      required: false
      description: |
        Criterio de orden del listado. Si se envía junto con `sort`, `orden` tiene prioridad.
        Sin `orden`, si viene `sort` se respeta el orden legado; si no, ordena por fecha ascendente
        y desempata por id.
        - `fecha`: fecha ascendente, desempata por id.
        - `precio`: precio mínimo de los sectores del evento, ascendente.
        - `relevancia`: PUBLICADO antes que AGOTADO; dentro de cada estado, fecha ascendente y luego id.
          CANCELADO no se lista.
      schema:
        type: string
        enum: [fecha, precio, relevancia]
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Error (400 inválido, 401 sin usuario, 403 sin permiso, 404 no existe, 409 conflicto, 502 servicio dependiente no disponible)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    TipoEvento:
      type: string
      enum: [RECITAL, FESTIVAL, TEATRO, DEPORTE, CONFERENCIA, OTRO]
    EstadoEvento:
      type: string
      enum: [BORRADOR, CANCELADO, FINALIZADO, PUBLICADO, SUSPENDIDO, AGOTADO]
    EventoResumen:
      type: object
      required: [id, nombre, tipo, fecha, estado]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        fecha: { type: string, format: date-time }
        estado:
          $ref: '#/components/schemas/EstadoEvento'
    EventoUpdateRequest:
      type: object
      description: |
        Todos los campos son opcionales; se aplican solo los enviados. `fecha`, `lugarId` y
        `sectores` son estructurales y no pueden modificarse si el evento ya fue publicado.
      properties:
        nombre: { type: string, maxLength: 200 }
        descripcion: { type: string, maxLength: 255 }
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        fecha: { type: string, format: date-time }
        lugarId: { type: integer, format: int64 }
        sectores:
          type: array
          description: "IDs de sectores. Alias aceptado: sectorIds."
          items: { type: integer, format: int64 }
    EventoBorradorCreateRequest:
      type: object
      required: [nombre, descripcion, tipo, fecha, lugarId]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 200, pattern: '.*\S.*' }
        descripcion: { type: string, minLength: 1, maxLength: 255, pattern: '.*\S.*' }
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        fecha: { type: string, format: date-time }
        lugarId: { type: integer, format: int64 }
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteRequest'
    EventoResponse:
      type: object
      required: [id, nombre, tipo, fecha, estado, organizadorId]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        descripcion: { type: string }
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        fecha: { type: string, format: date-time }
        estado:
          $ref: '#/components/schemas/EstadoEvento'
        organizadorId: { type: integer, format: int64 }
        lugar:
          $ref: '#/components/schemas/LugarResponse'
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteResponse'
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'
        preciosSectores:
          type: object
          additionalProperties:
            type: number
            format: double
    EventoDetalleResponse:
      type: object
      required: [id, nombre, tipo, fecha, estado, organizadorId]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        descripcion: { type: string }
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        fecha: { type: string, format: date-time }
        estado:
          $ref: '#/components/schemas/EstadoEvento'
        organizadorId: { type: integer, format: int64 }
        lugar:
          $ref: '#/components/schemas/LugarResponse'
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteResponse'
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'
        preciosSectores:
          type: object
          additionalProperties:
            type: number
            format: double
    EventoEstadoResponse:
      type: object
      required: [id, nombre, estado]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        estado:
          $ref: '#/components/schemas/EstadoEvento'
    ParticipanteRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, minLength: 1, pattern: '.*\S.*' }
    ParticipanteResponse:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
    TipoSector:
      type: string
      enum: [NUMERADO, NO_NUMERADO]
    LugarCreateRequest:
      type: object
      required: [nombre, tipo, direccion, ciudad, latitud, longitud]
      properties:
        nombre: { type: string, minLength: 1, pattern: '.*\S.*' }
        tipo: { type: string, minLength: 1, pattern: '.*\S.*' }
        direccion: { type: string, minLength: 1, pattern: '.*\S.*' }
        ciudad: { type: string, minLength: 1, pattern: '.*\S.*' }
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
        capacidad:
          type: integer
          minimum: 0
    LugarResponse:
      type: object
      required: [id, nombre, tipo, direccion, ciudad, latitud, longitud]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        tipo: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
        capacidad: { type: integer }
    LugarDetalleResponse:
      type: object
      required: [id, nombre, tipo, direccion, ciudad, latitud, longitud, sectores]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, minLength: 1, pattern: '.*\S.*' }
        tipo: { type: string }
        direccion: { type: string }
        ciudad: { type: string }
        latitud: { type: number, format: double }
        longitud: { type: number, format: double }
        capacidad: { type: integer }
        sectores:
          type: array
          items:
            $ref: '#/components/schemas/SectorResponse'
    SectorNumeradoRequest:
      type: object

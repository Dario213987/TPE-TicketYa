      properties:
        nombre: { type: string, minLength: 1, pattern: '.*\S.*' }
        precio:
          type: number
          format: double
          minimum: 0
        filas:
          type: integer
          minimum: 1
        asientosPorFila:
          type: integer
          minimum: 1
    SectorNoNumeradoRequest:
      type: object
      required: [nombre, precio, capacidadMaxima]
      properties:
        nombre: { type: string, minLength: 1, pattern: '.*\S.*' }
        precio:
          type: number
          format: double
          minimum: 0
        capacidadMaxima:
          type: integer
          minimum: 1
    SectorResponse:
      type: object
      required: [id, nombre, precio, tipoSector]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        precio: { type: number, format: double }
        tipoSector:
          $ref: '#/components/schemas/TipoSector'
        capacidad: { type: integer }
        capacidadMaxima: { type: integer }
        filas: { type: integer }
        asientosPorFila: { type: integer }
    PrecioEventoSectorRequest:
      type: object

server.port=${SERVER_PORT:0}
spring.application.name=ms-eventos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eventos}
spring.datasource.username=${DB_USER:eventos}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${LIQUIBASE_CONTEXT:dev}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}

# Finalización automática de eventos.
# ShedLock evita que dos instancias ejecuten el proceso a la vez.
ticketya.eventos.finalizacion.enabled=${EVENTOS_FINALIZACION_ENABLED:true}
ticketya.eventos.finalizacion.cron=${EVENTOS_FINALIZACION_CRON:0 0 * * * *}
ticketya.eventos.finalizacion.lock-at-most-for=${EVENTOS_FINALIZACION_LOCK_AT_MOST_FOR:PT15M}
ticketya.eventos.finalizacion.lock-at-least-for=${EVENTOS_FINALIZACION_LOCK_AT_LEAST_FOR:PT1M}

# Relay de notificaciones pendientes hacia ms-tickets (outbox).
# Se puede desactivar mientras ms-tickets todavía no exponga los endpoints.
ticketya.eventos.notificaciones.enabled=${EVENTOS_NOTIFICACIONES_ENABLED:true}
ticketya.eventos.notificaciones.fixed-delay-ms=${EVENTOS_NOTIFICACIONES_FIXED_DELAY_MS:60000}
ticketya.eventos.notificaciones.batch-size=${EVENTOS_NOTIFICACIONES_BATCH_SIZE:50}
ticketya.eventos.notificaciones.max-intentos=${EVENTOS_NOTIFICACIONES_MAX_INTENTOS:5}
ticketya.eventos.notificaciones.lock-at-most-for=${EVENTOS_NOTIFICACIONES_LOCK_AT_MOST_FOR:PT10M}
ticketya.eventos.notificaciones.lock-at-least-for=${EVENTOS_NOTIFICACIONES_LOCK_AT_LEAST_FOR:PT10S}
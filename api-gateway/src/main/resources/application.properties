server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}

spring.cloud.gateway.server.webflux.routes[0].id=eventos
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-eventos
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/eventos/**,/api/lugares/**

spring.cloud.gateway.server.webflux.routes[1].id=tickets
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-tickets
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/tickets/**

spring.cloud.gateway.server.webflux.routes[2].id=devoluciones
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-devoluciones
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/devoluciones/**

# Timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.cloud.gateway.server.webflux.httpclient.response-timeout=${GATEWAY_RESPONSE_TIMEOUT:15s}

spring.cloud.loadbalancer.cache.ttl=${LB_CACHE_TTL:5s}

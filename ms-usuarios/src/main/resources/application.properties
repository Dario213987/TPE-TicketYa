server.port=${SERVER_PORT:0}
spring.application.name=ms-usuarios

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/usuarios}
spring.datasource.username=${DB_USER:usuarios}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.data.web.pageable.max-page-size=100

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}

ticketya.usuarios.admin.email=${USUARIOS_ADMIN_EMAIL:}
ticketya.usuarios.admin.password=${USUARIOS_ADMIN_PASSWORD:}

ticketya.jwt.secret=${JWT_SECRET}
ticketya.jwt.ttl=${JWT_TTL:PT1H}
ticketya.jwt.issuer=${JWT_ISSUER:ticketya-usuarios}
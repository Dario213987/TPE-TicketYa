server.port=${SERVER_PORT:0}
spring.application.name=ms-devoluciones

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/devoluciones}
spring.datasource.username=${DB_USER:devoluciones}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true

eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_S:5}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_S:15}
eureka.client.registry-fetch-interval-seconds=${EUREKA_FETCH_INTERVAL_S:5}

transacciones.name=${TRANSACCIONES_SERVICE_NAME:ms-transacciones}
transacciones.contextId=transacciones
spring.cloud.openfeign.client.config.transacciones.request-interceptors[0]=org.tudai.ticketya.devoluciones.client.TransaccionesHeadersInterceptor

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

ticketya.devoluciones.reintegro.enabled=${REINTEGRO_MASIVO_ENABLED:true}
ticketya.devoluciones.reintegro.batch-size=${REINTEGRO_MASIVO_BATCH_SIZE:100}
ticketya.devoluciones.reintegro.max-intentos=${REINTEGRO_MASIVO_MAX_INTENTOS:10}
ticketya.devoluciones.reintegro.intervalo-ms=${REINTEGRO_MASIVO_INTERVALO_MS:5000}
ticketya.devoluciones.reintegro.timeout-segundos=${REINTEGRO_MASIVO_TIMEOUT_S:120}